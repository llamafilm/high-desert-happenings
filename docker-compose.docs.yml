services:
  docs:
    image: high_desert_happenings_local_docs
    container_name: high_desert_happenings_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - /app/.venv
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./high_desert_happenings:/app/high_desert_happenings:z
    ports:
      - '9000:9000'
    command: /start-docs
