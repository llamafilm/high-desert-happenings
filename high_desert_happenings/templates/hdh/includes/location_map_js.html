{% comment %}
  Leaflet JavaScript include for location map.
  Include this in {% block javascript %} section of templates using the location map.
{% endcomment %}
{% if location and location.latitude and location.longitude %}
  <!-- Leaflet JS -->
  <script defer
          src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
{% endif %}
