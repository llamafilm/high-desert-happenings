{% comment %}
  Reusable map component for displaying a location on a Leaflet map.
{% endcomment %}
{% load static %}

{% if location and location.latitude and location.longitude %}
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <div class="card mb-3">
    <div class="card-body p-0">
      <div id="map"
           style="height: 300px;
                  width: 100%"
           data-latitude="{{ location.latitude }}"
           data-longitude="{{ location.longitude }}"
           data-name="{{ location.name|escapejs }}"
           data-address="{{ location.address|escapejs }}"></div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <!-- Location Map Initialization -->
  <script defer src="{% static 'js/location_map.js' %}"></script>
{% endif %}
