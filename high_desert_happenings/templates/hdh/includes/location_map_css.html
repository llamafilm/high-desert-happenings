{% comment %}
  Leaflet CSS include for location map.
  Include this in {% block css %} section of templates using the location map.
{% endcomment %}
{% if location and location.latitude and location.longitude %}
  <!-- Leaflet CSS -->
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
{% endif %}
