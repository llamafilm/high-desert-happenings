# This runs HTTPS reverse proxy on localhost with self-signed certifiate
log:
  level: INFO

entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: web-secure
  web-secure:
    address: ':443'

http:
  routers:
    web-secure-router:
      rule: 'Host(`localhost`)'
      entryPoints:
        - web-secure
      middlewares:
        - csrf
      service: django
      tls: {}

  middlewares:
    csrf:
      # https://doc.traefik.io/traefik/master/middlewares/http/headers/#hostsproxyheaders
      # https://docs.djangoproject.com/en/dev/ref/csrf/#ajax
      headers:
        hostsProxyHeaders: ['X-CSRFToken']

  services:
    django:
      loadBalancer:
        servers:
          - url: http://django:5000

providers:
  # https://doc.traefik.io/traefik/master/providers/file/
  file:
    filename: /etc/traefik/traefik.yml
    watch: true
